services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: dronefleet-postgres:local
    container_name: dronefleet-postgres
    environment:
      POSTGRES_DB: dronefleet
      POSTGRES_USER: dronefleet
      POSTGRES_PASSWORD: dronefleet
    ports:
      - "5432:5432"
    volumes:
      - dronefleet-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dronefleet -d dronefleet"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: local
        GIT_SHA: local
        BUILD_TIME: local
    image: dronefleet-app:local
    container_name: dronefleet-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: dronefleet
      APP_ENV: local
      APP_PORT: "8080"
      LOG_LEVEL: info
      FEATURE_CACHE_WARM: "true"
      MAX_FLEET_SIZE: "50"
      TELEMETRY_BUFFER: "100"
      APP_VERSION: local
      GIT_SHA: local
      BUILD_TIME: local
      DATABASE_URL: postgres://dronefleet:dronefleet@postgres:5432/dronefleet?sslmode=disable
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  dronefleet-postgres-data:
